<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to ProjectHub</title>
  </head>
  <body style="margin:0; padding:24px; background:#f4f7fb; color:#172033; font-family:Arial, sans-serif;">
    <main style="max-width:560px; margin:0 auto; overflow:hidden; background:#ffffff; border-radius:12px; box-shadow:0 4px 18px rgba(22, 32, 51, 0.10);">
      <div style="padding:28px 32px; background:#3158d4; color:#ffffff;">
        <div style="font-size:20px; font-weight:700;">ProjectHub</div>
        <div style="margin-top:8px; font-size:14px; opacity:0.85;">Your workspace is ready</div>
      </div>
      <div style="padding:32px;">
        <h1 style="margin:0 0 16px; font-size:24px;">Welcome, {{ username }}!</h1>
        <p style="margin:0; color:#526078; font-size:16px; line-height:1.6;">
          Your account has been created. You can now create projects, organize work, and collaborate with your team.
        </p>
      </div>
    </main>
  </body>
</html>
