[project]
name = "project-hub"
version = "0.1.0"
description = "Jira-like project management app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "cryptography>=48.0.1",
    "dotenv>=0.9.9",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "idna>=3.15",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.31",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx2>=2.12.0",
    "mypy>=2.0.0",
    "pip-audit>=2.10.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.mypy]
disable_error_code = "annotation-unchecked"
exclude = ["^alembic/versions/"]
