x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://{POSTGRES_USER}:{POSTGRES_PASSWORD}@db:5432/{POSTGRES_DB}
  DATABASE__POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE__MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
  DATABASE__POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
  DATABASE__POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
  DATABASE__POOL_PRE_PING: "true"
  DATABASE__POOL_USE_LIFO: "true"
  DATABASE__CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
  DATABASE__STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: amqp://project_hub:${RABBITMQ_PASSWORD:-project_hub}@rabbitmq:5672/project_hub
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  READINESS_REQUIRE_REDIS: "true"
  READINESS_REQUIRE_RABBITMQ: "false"
  AUTH_JWT__PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
  AUTH_JWT__PUBLIC_KEY_PATH: /run/secrets/jwt_public_key

services:
  api:
    build: ./backend
    container_name: project-hub-api
    ports:
      - "8000:8000"
    environment: *app-env
    secrets:
      - jwt_private_key
      - jwt_public_key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  migrate:
    build: ./backend
    container_name: project-hub-migrate
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:17-alpine
    container_name: project-hub-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - project_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_hub"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: project-hub-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - project_hub_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: project-hub-worker
    command:
      [
        "celery",
        "-A",
        "app.jobs.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--pool=prefork",
        "--concurrency=1",
        "--without-mingle",
        "--without-gossip",
      ]
    environment: *app-env
    secrets:
      - jwt_private_key
      - jwt_public_key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  beat:
    build: ./backend
    container_name: project-hub-beat
    command:
      [
        "celery",
        "-A",
        "app.jobs.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment: *app-env
    secrets:
      - jwt_private_key
      - jwt_public_key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: project-hub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: project_hub
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-project_hub}
      RABBITMQ_DEFAULT_VHOST: project_hub
    volumes:
      - project_hub_rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  project_hub_pgdata:
  project_hub_redisdata:
  project_hub_rabbitmqdata:

secrets:
  jwt_private_key:
    file: ./backend/certs/private.pem
  jwt_public_key:
    file: ./backend/certs/public.pem
